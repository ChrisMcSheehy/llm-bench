[project]
name = "llmbench"
version = "0.1.0"
description = "Local-LLM quality test bench: fingerprint detection, pluggable evaluators, dashboard"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# Needed only by the coding evaluator's test harness (runs in a subprocess).
exec = ["pytest>=8.0"]

[project.scripts]
llmbench = "llmbench.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llmbench*"]
# The bundled data tree holds .py files (reference solutions and their tests) that are
# data, not importable modules. Without this they would be picked up as namespace
# packages and installed as importable code.
exclude = ["llmbench.data*"]

# Bundled test data must ship inside the wheel. Without this, an installed copy has
# no datasets, no coding problems and no suite files.
[tool.setuptools.package-data]
llmbench = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the project root on the import path so `import selftest` finds selftest.py
# without it having to be installed as a package.
pythonpath = ["."]
