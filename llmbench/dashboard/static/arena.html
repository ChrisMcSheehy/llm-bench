<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmbench · arena</title>
<style>
  :root{
    --bg:#0e1418; --panel:#151d23; --panel2:#111a1f; --line:#243139;
    --ink:#c7d3da; --mut:#7d8f9a; --dim:#546570;
    --sig:#4fd6c8; --sig2:#f2b23e; --bad:#e5646e;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  a{color:var(--sig);text-decoration:none}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:16px 30px;border-bottom:1px solid var(--line);background:var(--panel2)}
  header h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:600}
  header h1 .dot{color:var(--sig)}
  .modes{display:flex;gap:6px;align-items:center}
  .modes button{background:#0f171c;border:1px solid var(--line);color:var(--mut);
                font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:5px;cursor:pointer}
  .modes button.on{border-color:var(--sig);color:var(--sig)}
  .modes a{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:5px}
  .wrap{max-width:1200px;margin:0 auto;padding:24px 30px 80px}
  .promptcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
  .promptcard .eyebrow{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .promptcard .ptext{white-space:pre-wrap;color:#e8f0f3;line-height:1.55}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;min-height:220px}
  .side .tag{font-family:var(--mono);font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .side .tag b{color:var(--sig)}
  .badge{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .resp{white-space:pre-wrap;line-height:1.55;flex:1;overflow-wrap:anywhere}
  .frame{width:100%;height:460px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .controls{display:flex;gap:10px;justify-content:center;margin:20px 0 8px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:13px;padding:11px 18px;border-radius:6px;border:1px solid var(--line);background:#0f171c;color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--sig)}
  .btn.bad:hover{border-color:var(--bad);color:var(--bad)}
  .btn .k{color:var(--dim);font-size:11px;margin-left:6px}
  .hint{text-align:center;color:var(--dim);font-family:var(--mono);font-size:11px;margin-top:4px}
  .stars{display:flex;gap:8px;justify-content:center;margin:20px 0 6px}
  .star{font-size:30px;color:var(--dim);cursor:pointer;line-height:1;transition:color .1s}
  .star:hover,.star.hot{color:var(--sig2)}
  .board{margin-top:36px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .board h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:0 0 10px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  td.num{text-align:right}
  .elo{color:var(--sig);font-weight:600}
  .empty{color:var(--dim);font-family:var(--mono);font-size:12px;padding:30px 0;text-align:center}
  @media(max-width:820px){.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>llm<span class="dot">·</span>arena</h1>
  <div class="modes">
    <button id="mCompare" class="on" onclick="setMode('compare')">Compare (A/B)</button>
    <button id="mRate" onclick="setMode('rate')">Rate (stars)</button>
    <a href="/gallery">gallery</a>
    <a href="/">← dashboard</a>
  </div>
</header>
<div class="wrap">
  <div id="stage"><div class="empty">loading…</div></div>
  <div class="board"><h2 id="boardTitle">arena leaderboard</h2><div id="board"></div></div>
</div>
<script>
const j=async u=>(await fetch(u)).json();
const post=async(u,b)=>(await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})).json();
let mode="compare", cur=null, starVal=0;
function setMode(m){mode=m;document.getElementById("mCompare").classList.toggle("on",m==="compare");document.getElementById("mRate").classList.toggle("on",m==="rate");next();}
function badge(x){const s=[];if(x.latency_ms!=null)s.push((x.latency_ms/1000).toFixed(1)+"s");if(x.tok_per_sec!=null)s.push(x.tok_per_sec.toFixed(0)+" tok/s");if(x.output_tokens!=null)s.push(x.output_tokens+" tok");return s.join(" · ");}
function bodyHtml(render,id){return render==="html"?`<iframe id="${id}" class="frame" sandbox="allow-scripts allow-pointer-lock"></iframe>`:`<div class="resp" id="${id}"></div>`;}
function fill(render,id,content){const el=document.getElementById(id);if(!el)return;if(render==="html")el.srcdoc=content;else el.textContent=content;}
async function next(){
  const stage=document.getElementById("stage");
  if(mode==="compare"){
    cur=await j("/api/arena/matchup");
    if(!cur.available){stage.innerHTML=`<div class="empty">${cur.reason}</div>`;return loadBoard();}
    stage.innerHTML=`
      <div class="promptcard"><div class="eyebrow">${cur.category} · prompt</div><div class="ptext">${esc(cur.prompt)}</div></div>
      <div class="pair">
        <div class="side"><div class="tag"><span>Model <b>A</b></span><span class="badge">${badge(cur.a)}</span></div>${bodyHtml(cur.render,"bodyA")}</div>
        <div class="side"><div class="tag"><span>Model <b>B</b></span><span class="badge">${badge(cur.b)}</span></div>${bodyHtml(cur.render,"bodyB")}</div>
      </div>
      <div class="controls">
        <button class="btn" onclick="vote('a')">◀ A is better<span class="k">1</span></button>
        <button class="btn" onclick="vote('tie')">Tie<span class="k">2</span></button>
        <button class="btn" onclick="vote('b')">B is better ▶<span class="k">3</span></button>
        <button class="btn bad" onclick="vote('both_bad')">Both weak<span class="k">0</span></button>
        <button class="btn" onclick="next()">Skip<span class="k">s</span></button>
      </div>
      <div class="hint">keys 1 · 2 · 3 · 0 · s — blind & randomised${cur.render==="html"?" — artifacts run sandboxed":""}</div>`;
    fill(cur.render,"bodyA",cur.a.content);fill(cur.render,"bodyB",cur.b.content);
  }else{
    cur=await j("/api/arena/single");starVal=0;
    if(!cur.available){stage.innerHTML=`<div class="empty">${cur.reason}</div>`;return loadBoard();}
    stage.innerHTML=`
      <div class="promptcard"><div class="eyebrow">${cur.category} · prompt</div><div class="ptext">${esc(cur.prompt)}</div></div>
      <div class="pair"><div class="side" style="grid-column:1/-1"><div class="tag"><span>response</span><span class="badge">${badge(cur)}</span></div>${bodyHtml(cur.render,"bodyS")}</div></div>
      <div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<span class="star" data-n="${n}" onmouseover="hot(${n})" onmouseout="hot(starVal)" onclick="rate(${n})">★</span>`).join("")}</div>
      <div class="hint">keys 1–5 to rate · s to skip</div>`;
    fill(cur.render,"bodyS",cur.content);
  }
  loadBoard();
}
function hot(n){document.querySelectorAll("#stars .star").forEach(s=>s.classList.toggle("hot",+s.dataset.n<=n));}
async function rate(n){await post("/api/arena/rate",{prompt_id:cur.prompt_id,token:cur.token,score:n});next();}
async function vote(w){await post("/api/arena/vote",{prompt_id:cur.prompt_id,a_token:cur.a.token,b_token:cur.b.token,winner:w});next();}
async function loadBoard(){
  const d=await j("/api/arena/leaderboard");
  const el=document.getElementById("board");
  document.getElementById("boardTitle").textContent=`arena leaderboard · ${d.counts.pairwise} comparisons · ${d.counts.rating} ratings`;
  if(!d.board.length){el.innerHTML='<div class="empty">no votes yet — start rating</div>';return;}
  el.innerHTML=`<table><thead><tr><th>#</th><th>config</th><th class="num">Elo</th><th class="num">games</th><th class="num">win%</th><th class="num">★ avg</th></tr></thead><tbody>
    ${d.board.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.label)}</td><td class="num elo">${r.elo}</td><td class="num">${r.games}</td><td class="num">${r.win_rate==null?"—":(r.win_rate*100).toFixed(0)+"%"}</td><td class="num">${r.avg_stars==null?"—":r.avg_stars}</td></tr>`).join("")}</tbody></table>`;
}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
document.addEventListener("keydown",e=>{
  if(!cur)return;
  if(mode==="compare"){if(e.key==="1")vote("a");else if(e.key==="2")vote("tie");else if(e.key==="3")vote("b");else if(e.key==="0")vote("both_bad");else if(e.key==="s")next();}
  else{if("12345".includes(e.key))rate(+e.key);else if(e.key==="s")next();}
});
next();
</script>
</body>
</html>
