<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmbench · gallery</title>
<style>
  :root{--bg:#0e1418;--panel:#151d23;--panel2:#111a1f;--line:#243139;--ink:#c7d3da;
    --mut:#7d8f9a;--dim:#546570;--sig:#4fd6c8;--sig2:#f2b23e;--bad:#e5646e;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  a{color:var(--sig);text-decoration:none}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 30px;border-bottom:1px solid var(--line);background:var(--panel2)}
  header h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:600}
  header h1 .dot{color:var(--sig)}
  header a{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:5px}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 30px 80px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .tab{font-family:var(--mono);font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:#0f171c;color:var(--mut);cursor:pointer}
  .tab.on{border-color:var(--sig);color:var(--sig)}
  .tab .kind{color:var(--dim);margin-left:6px}
  .promptcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:18px}
  .promptcard .eyebrow{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
  .promptcard .ptext{white-space:pre-wrap;color:#e8f0f3;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column}
  .cell .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .cell .label{font-family:var(--mono);font-size:12px;color:#e8f0f3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .stat{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;margin-left:8px}
  .frame{width:100%;height:440px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .rate{display:flex;align-items:center;gap:6px;margin-top:10px}
  .rate .lbl{font-family:var(--mono);font-size:11px;color:var(--dim);margin-right:4px}
  .star{font-size:22px;color:var(--dim);cursor:pointer;line-height:1}
  .star:hover,.star.hot{color:var(--sig2)}
  .saved{font-family:var(--mono);font-size:11px;color:var(--sig);margin-left:6px}
  .empty{color:var(--dim);font-family:var(--mono);font-size:13px;padding:60px 0;text-align:center}
</style>
</head>
<body>
<header><h1>llm<span class="dot">·</span>gallery</h1>
  <div><a href="/arena" style="margin-right:8px">arena</a><a href="/">← dashboard</a></div></header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="stage"><div class="empty">loading…</div></div>
</div>
<script>
const j=async u=>(await fetch(u)).json();
const post=async(u,b)=>(await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})).json();
let data=[], sel=0;
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function stat(e){const s=[];if(e.latency_ms!=null)s.push((e.latency_ms/1000).toFixed(1)+"s");if(e.tok_per_sec!=null)s.push(e.tok_per_sec.toFixed(0)+" tok/s");if(e.output_tokens!=null)s.push(e.output_tokens+" tok");if(e.build_score!=null)s.push("build "+e.build_score);return s.join(" · ");}
async function boot(){
  data=await j("/api/gallery");
  const tabs=document.getElementById("tabs");
  if(!data.length){document.getElementById("stage").innerHTML='<div class="empty">No one-shot artifacts yet. Run a suite with the <code>oneshot</code> evaluator.</div>';return;}
  tabs.innerHTML=data.map((g,i)=>`<div class="tab ${i===0?'on':''}" data-i="${i}" onclick="pick(${i})">${g.prompt_id}<span class="kind">${g.kind}</span></div>`).join("");
  render();
}
function pick(i){sel=i;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",+t.dataset.i===i));render();}
function render(){
  const g=data[sel];
  const stage=document.getElementById("stage");
  stage.innerHTML=`
    <div class="promptcard"><div class="eyebrow">${g.kind} · prompt</div><div class="ptext">${esc(g.prompt)}</div></div>
    <div class="grid">${g.entries.map((e,idx)=>`
      <div class="cell">
        <div class="head"><span class="label">${esc(e.label)}</span><span class="stat">${stat(e)}</span></div>
        <iframe id="f${sel}_${idx}" class="frame" sandbox="allow-scripts allow-pointer-lock"></iframe>
        <div class="rate"><span class="lbl">rate</span>
          ${[1,2,3,4,5].map(n=>`<span class="star" data-n="${n}" onmouseover="hot(${sel},${idx},${n})" onmouseout="hot(${sel},${idx},0)" onclick="rate(${idx},${n})">★</span>`).join("")}
          <span class="saved" id="saved${idx}"></span>
        </div>
      </div>`).join("")}</div>`;
  g.entries.forEach((e,idx)=>{const f=document.getElementById(`f${sel}_${idx}`);if(f)f.srcdoc=e.html;});
}
function hot(s,idx,n){document.querySelectorAll(`#stage .cell:nth-child(${idx+1}) .star`).forEach(st=>st.classList.toggle("hot",+st.dataset.n<=n));}
async function rate(idx,n){
  const e=data[sel].entries[idx];
  await post("/api/arena/rate",{prompt_id:data[sel].prompt_id,token:e.token,score:n});
  document.getElementById("saved"+idx).textContent="✓ "+n;
}
boot();
</script>
</body>
</html>
