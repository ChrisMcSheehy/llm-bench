<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmbench · servers</title>
<style>
  :root{
    --bg:#0e1418; --panel:#151d23; --panel2:#111a1f; --line:#243139;
    --ink:#c7d3da; --mut:#7d8f9a; --dim:#546570;
    --sig:#4fd6c8; --sig2:#f2b23e; --bad:#e5646e;
    --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px}
  a{color:var(--sig);text-decoration:none}
  header{display:flex;align-items:center;justify-content:space-between;
         padding:16px 30px;border-bottom:1px solid var(--line);background:var(--panel2)}
  header h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:600}
  header h1 .dot{color:var(--sig)}
  .modes{display:flex;gap:6px;align-items:center}
  .modes a{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:5px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 30px 80px}
  .intro{color:var(--mut);line-height:1.6;margin:0 0 20px;max-width:70ch}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
        padding:16px 18px;margin-bottom:14px}
  .row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .name{font-family:var(--mono);font-size:15px;color:#e8f0f3;margin:0 0 8px}
  .meta{font-family:var(--mono);font-size:12px;color:var(--dim);line-height:1.7;
        overflow-wrap:anywhere}
  .meta b{color:var(--mut);font-weight:400}
  .args{color:var(--sig2)}
  .state{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .up{color:var(--sig)}
  .down{color:var(--dim)}
  .btn{font-family:var(--mono);font-size:13px;padding:9px 16px;border-radius:6px;
       border:1px solid var(--line);background:#0f171c;color:var(--ink);cursor:pointer}
  .btn:hover:not(:disabled){border-color:var(--sig)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.stop:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
  .side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .err{margin-top:12px;border-left:2px solid var(--bad);padding:8px 12px;
       background:#1a1114;color:#f0c8cc;font-family:var(--mono);font-size:12px;
       white-space:pre-wrap;overflow-x:auto;max-height:320px;overflow-y:auto}
  .empty{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px}
  .empty pre{font-family:var(--mono);font-size:12px;color:var(--sig2);
             background:var(--panel2);padding:14px;border-radius:6px;overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>llmbench<span class="dot">.</span>servers</h1>
  <div class="modes">
    <a href="/">leaderboard</a>
    <a href="/arena">arena</a>
    <a href="/gallery">gallery</a>
  </div>
</header>

<div class="wrap">
  <p class="intro">
    Model servers llmbench may start. Because the bench launches these itself, it knows
    the arguments each was started with &mdash; which is what lets two builds, or two
    layer splits, be told apart in the leaderboard.
  </p>
  <div id="list"></div>
</div>

<script>
const list = document.getElementById("list");

// Only ever sends a profile name. The set of things that can run is the YAML file on
// disk, never anything this page constructs.
async function api(path, method) {
  const r = await fetch(path, {method: method || "GET"});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || (r.status + " " + r.statusText));
  return body;
}

function card(s) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="row">
      <div>
        <p class="name">${esc(s.name)}</p>
        <div class="meta">
          <div><b>binary</b> ${esc(s.binary)}</div>
          <div><b>model</b> ${esc(s.model)}</div>
          <div><b>args</b> <span class="args">${esc(s.args.join(" ")) || "—"}</span></div>
        </div>
      </div>
      <div class="side">
        <div class="state ${s.running ? "up" : "down"}">
          ${s.running ? "running · " + esc(s.base_url) : "stopped"}
        </div>
        <button class="btn ${s.running ? "stop" : ""}"></button>
      </div>
    </div>`;

  const button = el.querySelector("button");
  button.textContent = s.running ? "stop" : "start";
  button.onclick = async () => {
    button.disabled = true;
    button.textContent = s.running ? "stopping…" : "starting…";
    const old = el.querySelector(".err");
    if (old) old.remove();
    try {
      await api(`/api/servers/${encodeURIComponent(s.name)}/${s.running ? "stop" : "start"}`,
                "POST");
      await refresh();
    } catch (e) {
      // The server's own output is the useful part of a failed start.
      const err = document.createElement("div");
      err.className = "err";
      err.textContent = e.message;
      el.appendChild(err);
      button.disabled = false;
      button.textContent = s.running ? "stop" : "start";
    }
  };
  return el;
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function empty() {
  const el = document.createElement("div");
  el.className = "empty";
  el.innerHTML = `
    <p class="intro" style="margin-bottom:14px">
      No launch profiles yet. Create <code>~/.llmbench/servers.yaml</code>:
    </p>
    <pre>servers:
  vulkan-b10148:
    binary: /path/to/llama-server
    model:  /path/to/model.gguf
    args:   ["-ngl", "99", "-c", "16384"]</pre>`;
  return el;
}

async function refresh() {
  const servers = await api("/api/servers");
  list.replaceChildren(...(servers.length ? servers.map(card) : [empty()]));
}

refresh();
</script>
</body>
</html>
